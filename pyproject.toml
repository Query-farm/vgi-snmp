[project]
name = "vgi-snmp-worker"
version = "0.2.0"
description = "Query SNMP devices (GET, WALK, MIB tables, v1/v2c/v3) from DuckDB SQL"
readme = "README.md"
license = "MIT-0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    # [http] adds the HTTP transport (`--http`) used by Docker deploys.
    # SDK bumps go through the template (minor bumps can raise the protocol).
    "vgi-python[http]>=0.55.2,<0.56",
    # Pure-Python SNMP engine (v1/v2c/v3, BSD-2-Clause).
    "pysnmp>=7.1.32,<8",
    # SNMPv3 privacy (AES/DES); pysnmp imports it lazily and fails v3 authPriv without it.
    "cryptography>=44",
]

[project.optional-dependencies]
# HTTP-serving extra installed by the Docker image (`pip install '.[serve]'`):
# `http` so the container can serve `--http` (/health + VGI RPC), plus `oauth`
# (JWT verification) so the image can run in Orchard hosted mode
# (`VGI_ORCHARD_HOSTED=1` with VGI_JWT_ISSUER/AUDIENCE/JWKS_URI and VGI_SIGNING_KEY).
serve = [
    "vgi-python[http,oauth]>=0.55.2,<0.56",
]

[project.scripts]
vgi-snmp-worker = "snmp_worker.worker:main"

[dependency-groups]
dev = [
    # The pushdown recipe evaluates predicates locally; a worker that uses filter
    # pushdown must add the `haybarn` extra to its own dependencies.
    "vgi-python[haybarn]>=0.55.2,<0.56",
    "pytest>=8.4",
    "mypy>=1.18",
    "ruff>=0.14",
    "pyarrow-stubs>=20.0",
    # Local SNMP agent the tests query (test/snmp_agent).
    "snmpsim>=1.2.2",
    "pysmi>=1.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snmp_worker"]

[tool.ruff]
line-length = 120
target-version = "py314"
# Generated by pysmi from the IETF MIB sources; see src/snmp_worker/mibs/README.md.
extend-exclude = ["src/snmp_worker/mibs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "D"]
# RUF012: the SDK declares metadata as plain class attributes on `class Meta`.
ignore = ["D203", "D213", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"test/*" = ["D"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests", "examples"]
exclude = ["src/snmp_worker/mibs/"]

[[tool.mypy.overrides]]
module = ["vgi.*", "vgi_rpc.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
# pysnmp and pyasn1 ship no type information.
module = ["pysnmp.*", "pyasn1.*"]
ignore_missing_imports = true

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
allow-init-docstring = true
skip-checking-short-docstrings = true
exclude = "src/snmp_worker/mibs"

[tool.pytest.ini_options]
testpaths = ["tests"]
