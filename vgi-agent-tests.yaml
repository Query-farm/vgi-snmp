# Private graders for the public vgi.agent_test_tasks in the worker's catalog metadata.
# `vgi-lint lint --ai` runs an agent on each prompt and grades it with reference_sql/check_sql.
# See https://github.com/Query-farm/vgi-lint-check (VGI920). All tasks are offline MIB lookups.
tasks:
  - name: ifinoctets_oid
    reference_sql: SELECT snmp.main.snmp_oid('IF-MIB::ifHCInOctets') AS oid
  - name: oid_to_name
    reference_sql: SELECT snmp.main.snmp_oid_name('1.3.6.1.2.1.1.3.0') AS name
  - name: iftable_columns
    reference_sql: >-
      SELECT count(*) AS columns FROM snmp.main.snmp_mib_objects(module := 'IF-MIB', kind := 'column')
      WHERE oid LIKE '1.3.6.1.2.1.2.2.1.%'
  - name: counter64_columns
    reference_sql: >-
      SELECT name FROM snmp.main.snmp_mib_objects(module := 'IF-MIB', kind := 'column')
      WHERE syntax = 'Counter64' ORDER BY string_split(oid, '.')::INTEGER[]
  # Device functions bind offline (schemas come from the MIBs), so DESCRIBE grades them without an agent.
  - name: ifxtable_counter_type
    reference_sql: >-
      SELECT column_type FROM (DESCRIBE SELECT ifHCInOctets FROM snmp.main.snmp_table('192.0.2.1', 'ifXTable'))
  - name: get_exact_value_column
    reference_sql: >-
      SELECT column_name, column_type FROM (DESCRIBE SELECT * FROM snmp.main.snmp_get('192.0.2.1', 'sysUpTime.0'))
      WHERE column_name = 'value_int'
  - name: walk_result_columns
    reference_sql: >-
      SELECT count(*) AS columns FROM (DESCRIBE SELECT * FROM snmp.main.snmp_walk('192.0.2.1', 'system'))
